<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Presently — Attendance Tracker</title>
    <meta
      name="description"
      content="Presently tells you exactly how many classes you can miss and how many you need to attend to stay on target."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Presently" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Presently — Attendance Tracker" />
    <meta
      property="og:description"
      content="Attendance, without the mental arithmetic. See how many classes you can safely miss."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <script>
      /*
        Applied before first paint so a returning user never sees the wrong
        theme flash. Kept inline and dependency-free on purpose.
      */
      ;(function () {
        try {
          var stored = localStorage.getItem('presently-theme')
          var mode = stored === 'light' || stored === 'dark' ? stored : null
          if (!mode) {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = mode
          document.documentElement.style.colorScheme = mode
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>JavaScript is required</h1>
        <p>Presently needs JavaScript enabled to load your attendance.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
